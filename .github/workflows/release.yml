name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write   # required to create tags & releases

jobs:
  release:
    runs-on: ubuntu-latest

    outputs:
      released: ${{ steps.detect-release.outputs.released }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # REQUIRED for semantic-release
      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Debug Git state
        run: |
          git tag
          git log --oneline -5
          git describe --tags --abbrev=0 || echo "No tags found"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        # Pinned (see REL2-12): this job holds `contents: write` and cuts
        # every real release — an unpinned `pip install` here means an
        # upstream major-version bump (python-semantic-release has a
        # track record of breaking CLI/config compatibility across
        # majors) could silently break the release pipeline with no
        # signal until an actual release attempt fails, and this repo's
        # own `uv.lock` doesn't govern this workflow's Python environment
        # at all. Bump deliberately via PR.
        run: pip install python-semantic-release==10.6.2 build==1.6.0

      - name: Capture tag before release
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - name: Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version
          semantic-release publish

      - name: Detect whether a new version was actually released
        id: detect-release
        run: |
          after="$(git describe --tags --abbrev=0 2>/dev/null || echo none)"
          if [ "${{ steps.before.outputs.tag }}" != "$after" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload built distribution for the PyPI publish job
        if: steps.detect-release.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish-pypi:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI trusted publishing (OIDC) — no API token needed

    steps:
      - name: Download built distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, as of 2026-09-05 (tracks v1.14.2)
        with:
          packages-dir: dist/