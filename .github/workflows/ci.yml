name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default (see SEC2-7): every job only ever needs to read
# repo contents to check out and run lint/tests — nothing here pushes
# commits, creates releases, or needs any other scope. Narrow further
# per-job only where a job genuinely needs more (contrast `release.yml`,
# which holds `contents: write` and, for its PyPI publish job,
# `id-token: write`).
permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: make install-dev

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Audit dependencies
        run: make audit

      - name: Test
        run: make test

  integration-test:
    name: Live Integration Tests (OpenFGA + Keycloak + Redis + Postgres)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: make install-dev

      - name: Run live integration tests
        run: make test-integration

      - name: Tear down services
        if: always()
        run: docker compose down -v