name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default (see SEC2-7): every job only ever needs to read
# repo contents to check out and run lint/tests — nothing here pushes
# commits, creates releases, or needs any other scope. Narrow further
# per-job only where a job genuinely needs more (contrast `release.yml`,
# which holds `contents: write` and, for its PyPI publish job,
# `id-token: write`).
permissions:
  contents: read

# Cancel superseded runs for the same PR/branch (REL3-22) — but never on
# main, where each run gates a release (see release.yml).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: make install-dev

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Audit dependencies
        run: make audit

      - name: Test
        run: make test

      - name: Wheel metadata check (extras, py.typed, SQL files)
        run: make check-dist

  integration-test:
    name: Live Integration Tests (OpenFGA + Keycloak + Redis + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: make install-dev

      - name: Run live integration tests
        run: make test-integration

      - name: Tear down services
        if: always()
        run: docker compose down -v