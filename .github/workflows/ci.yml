name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default (see SEC2-7): every job only ever needs to read
# repo contents to check out and run lint/tests — nothing here pushes
# commits, creates releases, or needs any other scope. Narrow further
# per-job only where a job genuinely needs more (contrast `release.yml`,
# which holds `contents: write` and, for its PyPI publish job,
# `id-token: write`).
permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: make install-dev

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Audit dependencies
        run: make audit

      - name: Test
        run: make test

  integration-test:
    name: Live Integration Tests (OpenFGA + Keycloak + Redis + Postgres)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: make install-dev

      - name: Run live integration tests
        run: make test-integration

      - name: Tear down services
        if: always()
        run: docker compose down -v