version: 2
updates:
  # Keeps pinned GitHub Actions SHAs (see SEC2-7) current — opens a PR
  # bumping both the SHA and its trailing `# vX.Y.Z` comment when a
  # pinned action cuts a new release.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python dependencies (pyproject.toml / uv.lock) — reacts quickly to a
  # new CVE, complementing `pip-audit` (SEC2-8) rather than replacing it:
  # pip-audit catches a vulnerability in whatever is currently pinned,
  # Dependabot proposes the version bump that actually fixes it.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # Control panel (Next.js/React) — previously not covered at all, so
  # frontend CVEs got no PRs (SEC3-15). `pnpm audit --prod` runs in CI
  # (control-panel job) as the matching gate.
  - package-ecosystem: "npm"
    directory: "/control-panel"
    schedule:
      interval: "weekly"
