# ==========================================================
# django-authz — Docker Compose (development stack)
# ==========================================================
# Brings up three services for local end-to-end development:
#
#   demo      Django demo application (port 8000)
#   keycloak  Identity provider used for JWT issuance (port 8080)
#   openfga   Fine-grained authorisation server (port 8081)
#
# Usage:
#   docker compose up --build     start the stack
#   docker compose down -v        stop and remove volumes
#
# Configuration:
#   Copy .env.example → .env and adjust values before starting.
# ==========================================================

services:

  # ── Django demo application ────────────────────────────
  demo:
    build: .
    container_name: django-authz-demo
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-demo}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-django-authz-demo}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-demo-secret}
      OPENFGA_API_URL: http://openfga:8080
      OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:-}
    depends_on:
      keycloak:
        condition: service_healthy
      openfga:
        condition: service_started
    volumes:
      # Mount source for live reloading during development
      - ./demo_project:/app/demo_project
      - ./django_authz:/app/django_authz

  # ── Keycloak identity provider ─────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    # start-dev uses an embedded H2 database — suitable for local use only
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # ── OpenFGA authorisation server ───────────────────────
  openfga:
    image: openfga/openfga:latest
    container_name: openfga
    # Runs with an in-memory store by default — data is lost on restart
    command: run
    ports:
      - "8081:8080"   # HTTP API
      - "8082:8081"   # gRPC API
      - "3000:3000"   # Playground UI
