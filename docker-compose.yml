# ==========================================================
# Local dev stack: OpenFGA + Keycloak + Redis + Postgres
# ==========================================================
# OpenFGA host port is 8082 to avoid colliding with Keycloak
# (which defaults to 8080 inside the container → 8081 on host).
# Keycloak boots in dev mode and imports docker/keycloak/realm.json
# so examples/05_keycloak_fastapi.py works out of the box.
# Redis backs the live storage tests in tests/live/ (see `make
# test-integration`) and RedisCache/RedisTenantStore for manual testing.
# Postgres backs PostgresTenantStore/PostgresModelRegistry/
# PostgresAuditLogger — schema applied via py_authz.storage.schema.
# apply_schema(), not by this compose file.

services:
  openfga:
    # Pinned to a specific released tag, not `:latest` (see SEC2-9) — an
    # unpinned `openfga/openfga` floats to whatever the maintainers push
    # next with zero reproducibility or review point in this repo. Bump
    # deliberately via PR.
    image: openfga/openfga:v1.19.0
    container_name: openfga
    command: run
    ports:
      - "8082:8080" # Host: 8082 → OpenFGA HTTP API
      - "8083:8081" # Host: 8083 → gRPC API
      - "3000:3000" # Host: 3000 → Playground UI
    environment:
      OPENFGA_PLAYGROUND_ENABLED: "true"
      OPENFGA_HTTP_CORS_ENABLED: "true"
      OPENFGA_HTTP_CORS_ALLOWED_ORIGINS: "https://play.fga.dev,http://localhost:3000,http://127.0.0.1:3000,http://localhost"
      OPENFGA_HTTP_CORS_ALLOWED_HEADERS: "*"
      OPENFGA_HTTP_CORS_ALLOWED_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      OPENFGA_HTTP_CORS_ALLOW_PRIVATE_NETWORK: "true"
    healthcheck:
      # OpenFGA's image has no shell/wget/curl (distroless-style), but
      # ships `grpc_health_probe` and exposes gRPC health checking on its
      # gRPC port (8081 inside the container).
      test: ["CMD", "grpc_health_probe", "-addr=:8081"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080" # Host: 8081 → Keycloak admin + OIDC endpoints
    volumes:
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      # No curl/wget in this image, but bash is present — use bash's
      # built-in /dev/tcp to hit the management-interface health/ready
      # endpoint (KC_HEALTH_ENABLED=true, above) with no extra tooling.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  redis:
    # Pinned to a specific patch tag, not a floating major (see SEC2-9).
    image: redis:7.4.11-alpine
    container_name: redis
    ports:
      - "6380:6379" # Host: 6380 → Redis (avoids colliding with a locally
                    # installed Redis, which commonly already owns 6379)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  postgres:
    # Pinned to a specific patch tag, not a floating major (see SEC2-9).
    image: postgres:16.15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: py_authz
      POSTGRES_PASSWORD: py_authz
      POSTGRES_DB: py_authz
    ports:
      - "5433:5432" # Host: 5433 → Postgres (avoids colliding with a
                    # locally installed Postgres, which commonly already
                    # owns 5432)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U py_authz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
