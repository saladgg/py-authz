# ==========================================================
# django-authz — Docker Compose (development stack)
# ==========================================================

services:

  # ── Django demo application ────────────────────────────
  demo:
    build: .
    image: django-authz-demo:latest
    container_name: django-authz-demo
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-demo}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-django-authz-demo}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-demo-secret}
      OPENFGA_API_URL: http://openfga:8080
      OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:-}
    depends_on:
      openfga:
        condition: service_started
    volumes:
      - ./demo_project:/app/demo_project
      - ./django_authz:/app/django_authz
      - ./data/db:/app/demo_project/db   

  # ── Keycloak identity provider ─────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080" # Host port 8081 → Keycloak internal 8080

  # ── OpenFGA authorisation server ───────────────────────
  openfga:
    image: openfga/openfga:latest
    container_name: openfga
    command: run
    ports:
      - "8082:8080" # Host: 8082 → OpenFGA HTTP API (8080 inside container)
      - "8083:8081" # Host: 8083 → gRPC API
      - "3000:3000" # Host: 3000 → PlaygroundUI use (https://play.fga.dev/sandbox/?fga_api_host=127.0.0.1:8082&fga_api_scheme=http)
    environment:
      OPENFGA_PLAYGROUND_ENABLED: "true"
      OPENFGA_HTTP_CORS_ENABLED: "true"
      OPENFGA_HTTP_CORS_ALLOWED_ORIGINS: "https://play.fga.dev,http://localhost:3000,http://127.0.0.1:3000,http://localhost"
      OPENFGA_HTTP_CORS_ALLOWED_HEADERS: "*"
      OPENFGA_HTTP_CORS_ALLOWED_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      OPENFGA_HTTP_CORS_ALLOW_PRIVATE_NETWORK: "true"
