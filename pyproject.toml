[project]
name = "django-authz"
version = "0.1.0"
description = "Keycloak + OpenFGA integration for Django"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Your Name", email = "you@example.com" }]
license = { text = "MIT" }
keywords = ["django", "keycloak", "oidc", "jwt", "openfga", "authorization", "authentication"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Framework :: Django",
  "Framework :: Django :: 4",
  "Framework :: Django :: 5",
  "Topic :: Security :: Authentication",
]

dependencies = [
  "Django>=6.0.3",
  "mozilla-django-oidc>=5.0.2",
  "python-keycloak>=7.1.1",
  "openfga-sdk>=0.9.9",
  "requests>=2.32.5",
  "attrs>=26.1.0",
  "PyJWT>=2.12.1",
]

[dependency-groups]
test = [
  "pytest>=9.0.2",
  "pytest-cov>=5.0",
  "pytest-django>=4.9",
  "pytest-asyncio>=0.24",     
  "Faker>=35.0",            
]

dev = [
  {include-group = "test"},
  "ruff>=0.7",               
  "httpx>=0.28",
  "types-requests>=2.32",
  "mypy>=1.14",               
  "pre-commit>=4.0",
]


[project.urls]
Homepage = "https://github.com/yourorg/django-authz"
Changelog = "https://github.com/yourorg/django-authz/releases"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["django_authz*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = "test_*.py"
asyncio_mode = "auto"
addopts = "-ra -q --cov=django_authz --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["django_authz"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
strict = false
ignore_missing_imports = true
