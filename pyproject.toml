[project]
name = "py-authz"
version = "v1.6.0"
description = "Authz library based on OpenFGA"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Salad Guyo", email = "saladguyo60@gmail.com" }]
license = { text = "MIT" }
keywords = ["keycloak", "oidc", "jwt", "openfga", "authorization", "authentication"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Development Status :: 5 - Production/Stable",
]

dependencies = [
  "openfga-sdk>=0.10.4",
  # Upper-bounded at <1 (see SEC2-10): httpx is identity/crypto-adjacent
  # here (it carries every OpenFGA/JWKS HTTP call) and, while still pre-
  # 1.0, has kept a stable public API across the whole 0.x series this
  # project has tracked — the bound exists specifically to stop an
  # eventual 1.0 (which upstream has signaled will revisit some defaults)
  # from silently reaching a downstream `pip install` unreviewed.
  # Dependabot (SEC2-8) will still flag a new 0.x release quickly either
  # way.
  "httpx>=0.28.1,<1",
  "attrs>=26.1.0"
]

[dependency-groups]

fastapi = [
  "fastapi>=0.141.1",
  "starlette>=1.6.0",
  "uvicorn>=0.52.4"
]

redis = [
  "redis>=8.1.0"
]

postgres = [
  "asyncpg>=0.31.0"
]

cli = [
  "anyio>=4.14.2"
]

keycloak = [
  # Upper-bounded at <3 (see SEC2-10): PyJWT does JWT/JWKS signature
  # verification directly (the actual identity boundary — see SEC-2's
  # hardcoded `ALGORITHMS = ["RS256"]` allow-list), and its 1.x -> 2.x
  # jump changed `decode()`'s default verification behavior; a future
  # major is exactly the kind of unreviewed change this library
  # shouldn't let a downstream resolver pick up silently. Dependabot
  # (SEC2-8) will still flag a new 2.x release quickly.
  "pyjwt[crypto]>=2.13.0,<3"
]

all = [
  "fastapi>=0.141.1",
  "starlette>=1.6.0",
  "uvicorn>=0.52.4",
  "redis>=8.1.0",
  "asyncpg>=0.31.0",
  "anyio>=4.14.2",
  "pyjwt[crypto]>=2.13.0,<3"
]

control-plane = [
  # The control-plane API (py_authz/control_plane/) is a FastAPI service
  # that needs Postgres (its own new tables — operators, service_accounts,
  # model_versions, control_plane_jobs — plus the tenant/model/audit
  # tables every adopter already has), Redis (cache stats/invalidate,
  # CP-9), and OIDC/Keycloak (operator login, CP-2) on top of what `all`
  # already pulls in. `argon2-cffi` is control-plane-specific: it's the
  # one place in this library that hashes/verifies a bearer secret
  # directly (service-account credentials, CP-3) rather than delegating
  # to an IdP.
  {include-group = "fastapi"},
  {include-group = "postgres"},
  {include-group = "redis"},
  {include-group = "keycloak"},
  "argon2-cffi>=23.1.0",
]

test = [
  {include-group = "all"},
  {include-group = "control-plane"},
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-asyncio>=1.4.0",
  "Faker>=40.37.0",
]


dev = [
  {include-group = "test"},
  "ruff>=0.16.5",
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
  # Dependency-vulnerability scanning (see SEC2-8) — run via `make audit`
  # / `.github/workflows/ci.yml`'s `Audit dependencies` step.
  "pip-audit>=2.10.1",
]

[project.scripts]
py-authz = "py_authz.cli.main:main"
# Requires the `control-plane` extra; importing this entry point without
# it raises the same `pip install py-authz[control-plane]` guidance every
# other optional-dependency gap in this library gives (see utils/deps.py).
py-authz-control-plane = "py_authz.control_plane.__main__:main"

[project.urls]
Homepage = "https://github.com/saladgg/py-authz" # todo
Repository = "https://github.com/saladgg/py-authz"
Documentation = "https://github.com/saladgg/py-authz/docs"
Changelog = "https://github.com/saladgg/py-authz/releases"

[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["py_authz*"]

[tool.setuptools.package-data]
# `include-package-data = true` alone doesn't guarantee non-.py files
# land in a built wheel without a MANIFEST.in — this project has none,
# so the bundled Postgres schema (py_authz/storage/schema.py) needs its
# .sql files listed explicitly. `py.typed` (PEP 561) is the same class of
# gap (DX2-3): without it, a downstream project's own type checker treats
# every import from this fully type-hinted library as `Any`.
py_authz = ["storage/sql/*.sql", "py.typed"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# `S` (flake8-bandit-equivalent) added per SEC2-8. Findings: 663 `S101`
# ("use of `assert`") across `tests/**`, which is standard/expected
# practice in a pytest suite — silenced below via `per-file-ignores`
# rather than dropped from `select` repo-wide, so a real bandit-class
# finding introduced under `tests/` (e.g. a hardcoded secret, `S105`)
# still surfaces. The single non-test hit, `core/enforcement.py`'s
# `assert self.cache is not None` in `_check_and_cache()`, is a
# type-narrowing invariant already guarded by its caller — silenced
# inline with `# noqa: S101` there instead of widening this ignore.
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "S"]

# `Depends(...)`/`Query(...)`/etc. as a parameter default is FastAPI's own
# documented dependency-injection idiom (`control_plane/routes/*.py`,
# `adapters/fastapi.py`) — B008 ("no function calls in argument defaults")
# would otherwise flag every single one, since ruff doesn't special-case
# FastAPI's own callables by default.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
addopts = "-ra -q --cov=py_authz --cov-report=term-missing -v"

[tool.coverage.run]
branch = true
source = ["py_authz"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
plugins = "pydantic.mypy"
packages = ["py_authz"]
explicit_package_bases = true
disable_error_code = [
  "var-annotated", "import-untyped",
  "annotation-unchecked"
]
# `arg-type`/`union-attr` used to be globally disabled here too — that
# hid 4 real errors (see DX2-2), including a genuine nominal-typing
# mismatch on the library's own official `testkit.make_fake_authz()`
# helper. All fixed at the source (an `FGAClientProtocol`, corrected
# annotations, and two narrowly-scoped `# type: ignore[arg-type]` at
# genuinely-unavoidable PyJWT-stub sites) rather than re-suppressed here.

[tool.semantic_release]
commit_parser = "conventional"
version_toml = [
    "pyproject.toml:project.version:tf"
]
branch = "main"
build_command = "python -m build"

[tool.semantic_release.publish]
upload_to_vcs_release = true
dist_glob_patterns = ["dist/*"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
mask_initial_release = false # Override default behavior of suppressing detailed changelog on first version

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "chore", "build", "ci", "test", "style"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]   # refactor is often patch, but some teams treat it as minor
