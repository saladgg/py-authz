[project]
name = "py-authz"
version = "v1.0.0"
description = "Authz based on Keycloak and OpenFGA"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Salad Guyo", email = "saladguyo60@gmail.com" }]
license = { text = "MIT" }
keywords = ["keycloak", "oidc", "jwt", "openfga", "authorization", "authentication"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Development Status :: 5 - Production/Stable",
]

dependencies = [
  "openfga-sdk>=0.10.0",
  "httpx>=0.28.1",
  "attrs>=26.1.0"
]

[dependency-groups]

fastapi = [
  "fastapi>=0.135",
  "starlette>=1.0"
]

redis = [
  "redis>=7.4"
]

postgres = [
  "asyncpg>=0.31"
]

cli = [
  "anyio>=4.13"
]

all = [
  "fastapi>=0.135",
  "starlette>=1.0",
  "redis>=7.4",
  "asyncpg>=0.31",
  "anyio>=4.13"
]

test = [
  {include-group = "all"},
  "pytest>=9.0.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=1.3.0",    
  "Faker>=40.13.0",            
]


dev = [
  {include-group = "test"},
  "ruff>=0.15.10",               
  "mypy>=1.20.1",               
  "pre-commit>=4.5.1",
]

[project.scripts]
py-authz = "py_authz.cli.main:main"

[project.urls]
Homepage = "https://github.com/saladgg/py-authz"
Changelog = "https://github.com/saladgg/py-authz/releases"

[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["py_authz*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
addopts = "-ra -q --cov=py_authz --cov-report=term-missing -v"

[tool.coverage.run]
branch = true
source = ["py_authz"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
plugins = "pydantic.mypy"
packages = ["py_authz"]
explicit_package_bases = true
disable_error_code = [
  "var-annotated", "import-untyped",
  "annotation-unchecked", "union-attr", "arg-type"
]

[tool.semantic_release]
commit_parser = "conventional"
version_toml = [
    "pyproject.toml:project.version:tf"
]
branch = "main"
build_command = "python -m build"

[tool.semantic_release.publish]
upload_to_vcs_release = true

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.changelog.default_templates]
mask_initial_release = false # Override default behavior of suppressing detailed changelog on first version

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "chore", "build", "ci", "test", "style"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]   # refactor is often patch, but some teams treat it as minor