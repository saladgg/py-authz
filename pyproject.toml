[project]
name = "py-authz"
version = "0.1.0"
description = "Authz based on Keycloak and OpenFGA"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Salad Guyo", email = "saladguyo60@gmail.com" }]
license = { text = "MIT" }
keywords = ["keycloak", "oidc", "jwt", "openfga", "authorization", "authentication"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security :: Authentication",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Development Status :: 5 - Production/Stable",
]

dependencies = [
  "python-keycloak>=7.1.1",
  "openfga-sdk>=0.10.0",
  "PyJWT>=2.12.1",
  "redis>=7.4.0",
  "types-requests>=2.33",
  "httpx>=0.28.1",
  "anyio>=4.13.0", 
  "starlette>=1.0.0",
  "fastapi>=0.135.3",
  "asyncpg>=0.31.0",
]

[dependency-groups]
test = [
  "pytest>=9.0.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=1.3.0",    
  "Faker>=40.13.0",            
]

dev = [
  {include-group = "test"},
  "ruff>=0.15.10",               
  "mypy>=1.20.1",               
  "pre-commit>=4.5.1",
]

[project.scripts]
py-authz = "py_authz.cli.main:main"

[project.urls]
Homepage = "https://github.com/saladgg/py-authz"
Changelog = "https://github.com/saladgg/py-authz/releases"

[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["py_authz*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
addopts = "-ra -q --cov=py_authz --cov-report=term-missing -vv"

[tool.coverage.run]
branch = true
source = ["py_authz"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
strict = false
ignore_missing_imports = true
